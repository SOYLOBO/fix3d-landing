<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0B0B0B;color:#F4F2ED;
       font-family:Archivo,sans-serif;display:grid;grid-template-columns:1fr 470px}
  .copy{padding:64px 56px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
  .kick{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,242,237,.55);margin-bottom:26px}
  .stamp{background:#F5C518;color:#0B0B0B;font-family:'Archivo Black',sans-serif;text-transform:uppercase;
         letter-spacing:-.03em;font-size:76px;line-height:1;padding:10px 18px 14px;transform:rotate(-1.2deg)}
  .said{font-size:34px;font-weight:600;margin-top:30px}
  .url{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:23px;letter-spacing:.22em;
       text-transform:uppercase;color:#F5C518;margin-top:38px;border-bottom:3px solid #F5C518;padding-bottom:5px}
  img{width:470px;height:630px;object-fit:cover;object-position:52% 40%;display:block}
</style></head><body>
<div class="copy">
  <p class="kick">North NJ &middot; 3D printer repair</p>
  <p class="stamp">Print happens.</p>
  <p class="said">We fix 3D printers.</p>
  <p class="url">fix3d.co</p>
</div>
<img src="../images/failed-prints/hero-dragon.jpg" alt="">
</body></html>
